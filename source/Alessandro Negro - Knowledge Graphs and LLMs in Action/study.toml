# 교재 설정. agent-support/studykit 이 이 파일을 읽는다.
# 절차: agent-support/procedures/study-materials.md

[study]
slug = "knowledge-graphs-and-llms-in-action"
title = "Knowledge Graphs and LLMs in Action"
# 업스트림이 3.8/3.9/3.10 만 테스트했고, scispacy 가 요구하는 nmslib 는
# 3.11+ 에 휠이 없어 빌드가 깨진다. 올리지 말 것.
python = "3.10"
base_packages = ["neo4j>=5,<6", "tqdm", "ipykernel", "jupyterlab"]
kernel_name = "kglm"

[upstream]
url = "https://github.com/alenegro81/knowledge-graphs-and-llms-in-action.git"
dir = "code"
# 업스트림 코드가 `from util...` 로 임포트하고 util/../config.ini 를 읽으므로
# 이 셋은 교재 루트에 있어야 한다.
shared = ["util", "config.ini", "data"]

[notebook]
explainer_suffix = "_ko_explained.md"
# 봇 차단으로 200 이 아니지만 브라우저에서는 정상인 URL
url_allow_non_200 = ["https://www.omim.org/"]

# 챕터 원문 md 의 고유 키워드 빈도로 검증한 대응이다.
# 개수를 맞춰 짝지으면 틀린다 — 실제로 ch05·ch06 을 잘못 배치했었다.
# study-map-sources.py 로 재도출할 수 있다.
[mapping.chapters]
chapter_02_intelligent_systems_a_hybrid_approach = "ch02"
chapter_03_create_your_first_knowledge_graph_from_ontologies = "ch03"
chapter_04_from_simple_networks_to_multisource_integration = "ch04"
chapter_05_extracting_domain_specific_knowledge_from_unstructured_data = "ch07"
chapter_06_building_knowledge_graphs_with_large_language_models = "ch08"
chapter_07_named_entity_disambiguation = "ch09"
chapter_08_ned_with_open_llms_and_domain_ontologies = "ch10"
chapter_09_machine_learning_on_knowledge_graphs_a_primer_approach = "ch11"
chapter_10_graph_feature_engineering_manual_and_semiautomated_approaches = "ch12"
chapter_11_graph_representation_learning_and_graph_neural_networks = "ch13"
chapter_12_node_classification_and_link_prediction_with_gnns = "ch14"
chapter_13_knowledge_graph_powered_retrieval_augmented_generation = "ch15"
chapter_15_building_a_qa_agent_with_langgraph = "ch17"

# 리스팅 minor 번호 오프셋. 책 번호 = 파일 번호 - 오프셋.
# 챕터마다 다르므로 한 챕터의 값을 다른 챕터에 적용하면 안 된다.
[mapping.listing_offsets]
ch03 = 3
ch04 = 0

# 최종 출간본에 대응 챕터가 없는 MEAP 잔여 디렉터리. meap-only/ 에 둔다.
# ch05 는 전체가 miRNA 인데 miRNA 는 책 4장에 1회뿐이고,
# ch06 은 BBC+spaCy 문서 파이프라인인데 Jaccard 는 0회다.
[mapping]
meap_only = ["ch05", "ch06"]

# 리스팅 대응의 **정본**. 오프셋만으로는 표현할 수 없는 경우를 여기 명시한다.
# 최종 교재가 코드 없는 리스팅(LLM 프롬프트 등)을 중간에 끼워넣으면 그 뒤 번호가
# 전부 밀린다. ch04 는 책 4.20 이 프롬프트여서 4.21~4.22 가 업스트림 4.20~4.21 이다.
# 여기 없는 번호는 listing_offsets 로 계산한다.
[mapping.listings.ch04]
# 책 4.8 은 실재하는데 원서 md 에서 캡션 줄만 유실됐다 (PDF 주석 콜아웃이 코드와
# 뒤엉켰다). book_listings() 가 못 잡으므로 여기 선언해 coverage 게이트가 여분으로
# 오해하지 않게 한다. 저장소 파일 번호는 책과 같다.
"4.8"  = { repo = "4.8", title = "Create the graph projection in memory" }
"4.20" = { source = "explainer" }   # Example LLM analysis prompt — 코드 파일 없음
"4.21" = { repo = "4.20" }          # Importing the CKG database
"4.22" = { repo = "4.21" }          # Finding known protein-disease associations
"4.23" = { source = "explainer" }   # Example LLM clinical analysis prompt

# ch03 은 업스트림 파일이 망가져 해설판 본문을 써야 하는 두 건이 있다.
[mapping.listings.ch03]
"3.21" = { source = "explainer" }   # 저장소 3.24 가 3.25 와 내용 중복
"3.25" = { source = "explainer" }   # 저장소 3.28 이 0바이트

# ch02 는 책에 리스팅이 2.1 하나뿐인데 저장소에는 파일이 둘이다.
# 책 2.1 "Prompt for checking reasoning capabilities"(농부·양·강 건너기)의 본문이
# 저장소 파일 "2.3" 과 글자까지 일치한다. 저장소 "2.1 - ChatGPT example Prompt"
# (가상 의사 프롬프트)는 최종 출간본에 번호 붙은 리스팅으로 실려 있지 않다.
# 오프셋 기본값 0 으로 두면 엉뚱한 파일을 읽으므로 여기 명시한다.
[mapping.listings.ch02]
"2.1" = { repo = "2.3" }

# ch13 은 리스팅이 Cypher 가 아니라 파이썬이다. studykit.cypher.listings() 가 '.py' 를
# 의도적으로 제외하므로 `repo = "N.M"` 해석 경로를 쓸 수 없고, 게다가 책 11.2~11.7 은
# 파일 하나(GNN_all_in_one.py) 안의 개별 클래스라 '파일 하나 = 리스팅 하나' 가정이 깨진다.
# 그래서 source 를 "repo-file" 로 두고 path·symbol 로 실제 위치를 가리킨다.
#   repo       : 번호 접두사 붙은 리스팅 파일 (Cypher)
#   repo-file  : 코드가 저장소 안에 있으나 번호 파일이 아님 (path + symbol 또는 start/end)
#   explainer  : 정본이 해설판 본문 (reason 으로 이유를 밝힌다)
# 줄 번호는 소스가 갱신되면 조용히 어긋나므로 symbol(클래스명)을 정본으로 둔다.
# [mapping.listing_offsets] 에 ch13 을 넣지 말 것 — 번호 붙은 파일이 13.1 하나뿐이라
# 오프셋 +2 는 존재하지 않는 파일 13.3~13.8 을 가리킨다.
[mapping.listings.ch13]
"11.1" = { source = "repo-file", path = "listings/13.1 Applying node2vec embeddings to Karate Club’s Network.py", symbol = "__main__" }
"11.2" = { source = "repo-file", path = "listings/GNN_all_in_one.py", symbol = "MultiHeadGraphAttention" }
"11.3" = { source = "repo-file", path = "listings/GNN_all_in_one.py", symbol = "TransformerStyleGraphAttention" }
"11.4" = { source = "repo-file", path = "listings/GNN_all_in_one.py", symbol = "StructuralGraphTransformer" }
"11.5" = { source = "repo-file", path = "listings/GNN_all_in_one.py", symbol = "GraphSAGEUpdate" }
"11.6" = { source = "repo-file", path = "listings/GNN_all_in_one.py", symbol = "GatedGraphUpdate" }
"11.7" = { source = "repo-file", path = "listings/GNN_all_in_one.py", symbol = "JumpingKnowledge" }

# ch14 는 listings/ 디렉터리가 아예 없다. 업스트림은 재사용 부품(model/·eval/·plot/)과
# 학습 함수 라이브러리(train_for_*.py)만 담고 진입점이 없다 — 실제 실행 코드는 Readme 가
# 안내하는 Colab 노트북에만 있다. 그래서 책 리스팅 25개 중 모델 클래스 8건만 저장소에
# 있고, 데이터 준비·분할·로더 17건은 해설판 본문이 정본이다.
#   upstream-missing : 있어야 할 코드가 저장소에 없다 (노트북이 해설판 본문을 실행한다)
#   book-only        : 코드가 아니라 출력 예시다
[mapping.listings.ch14]
"12.1"  = { source = "explainer", reason = "upstream-missing" }   # 증분 노드 ID 부여
"12.2"  = { source = "explainer", reason = "upstream-missing" }   # edge_index 텐서 생성
"12.3"  = { source = "explainer", reason = "book-only" }          # edge_index 출력 예시
"12.4"  = { source = "explainer", reason = "upstream-missing" }   # 노드 특징 텐서
"12.5"  = { source = "explainer", reason = "upstream-missing" }   # 클래스 수치화 (LabelEncoder)
"12.6"  = { source = "explainer", reason = "upstream-missing" }   # PyG Data 객체 구성
"12.7"  = { source = "explainer", reason = "upstream-missing" }   # 라벨 있는 노드 마스크
"12.8"  = { source = "explainer", reason = "upstream-missing" }   # 학습·검증·시험 크기
"12.9"  = { source = "explainer", reason = "upstream-missing" }   # 마스크를 Data 에 부착
"12.10" = { source = "repo-file", path = "model/task_model.py", symbol = "NodeClassifier" }
"12.11" = { source = "repo-file", path = "model/gnn_model.py", symbol = "BaseGraphModel" }
"12.12" = { source = "repo-file", path = "model/gnn_model.py", symbol = "SAGE" }
"12.13" = { source = "repo-file", path = "model/gnn_model.py", symbol = "GAT" }
"12.14" = { source = "explainer", reason = "upstream-missing" }   # 장르 → 특징 벡터
"12.15" = { source = "explainer", reason = "upstream-missing" }   # 사용자·영화 ID → edge_index
"12.16" = { source = "explainer", reason = "book-only" }          # ID 매핑 출력 예시
"12.17" = { source = "explainer", reason = "upstream-missing" }   # HeteroData 구성
"12.18" = { source = "explainer", reason = "upstream-missing" }   # RandomLinkSplit
"12.19" = { source = "explainer", reason = "book-only" }          # 학습 데이터 상세 출력
"12.20" = { source = "explainer", reason = "book-only" }          # 검증·시험 데이터 상세 출력
"12.21" = { source = "explainer", reason = "upstream-missing" }   # LinkNeighborLoader 이웃 표집
"12.22" = { source = "repo-file", path = "model/task_model.py", symbol = "MovieLensLinkPredictor" }
"12.23" = { source = "repo-file", path = "model/util_model.py", symbol = "MovieLensEmbedding" }
"12.24" = { source = "repo-file", path = "model/hetero_model.py", symbol = "HeteroBaseModel" }
"12.25" = { source = "repo-file", path = "model/hetero_model.py", symbol = "HeteroSAGE" }

# ch11 도 listings/ 가 없다. 코드는 analysis/ 두 파일에만 있다.
# 책 9.5 는 원서 md 에서 캡션이 유실돼 book_listings() 가 잡지 못한다. title 을 함께 선언해
# 대조표에 제목이 붙게 했다 (4.8·10.5 도 같은 사정이다).
# 9.4·9.5 의 symbol 은 클래스 안 메서드라 dotted 표기다 — studykit.listing_source 가 해석한다.
# [mapping.listing_offsets] 에 ch11 을 넣지 말 것 — 번호 붙은 파일이 하나도 없다.
[mapping.listings.ch11]
"9.1"  = { source = "repo-file", path = "analysis/simple_classification_example.py", symbol = "draw_and_save_graph_picture" }
"9.2"  = { source = "repo-file", path = "analysis/simple_classification_example.py", symbol = "compute_degree_embeddings" }
"9.3"  = { source = "repo-file", path = "analysis/simple_classification_example.py", symbol = "compute_complex_embeddings" }
"9.4"  = { source = "repo-file", path = "analysis/simple_classification_example.py", symbol = "EvaluateEmbedding.train" }
"9.5"  = { source = "repo-file", path = "analysis/simple_classification_example.py", symbol = "EvaluateEmbedding.evaluate", title = "Evaluation function" }
"9.6"  = { source = "repo-file", path = "analysis/simple_classification_example.py", start = 96, end = 112 }
"9.7"  = { source = "explainer", reason = "book-only" }    # 출력 예시 — 9.6 + 9.2/9.3 이 만든다
"9.8"  = { source = "repo-file", path = "analysis/simple_classification_example.py", symbol = "compute_specific_degree_embeddings" }
"9.9"  = { source = "explainer", reason = "book-only" }    # 출력 예시 — 9.6 + 9.8 이 만든다
"9.10" = { source = "repo-file", path = "analysis/simple_clustering_example.py", symbol = "__main__" }

# ch12 는 저장소가 MEAP 번호(12.x)를 쓴다. 책 major(10) 와 다르므로 listing_offsets 로
# 표현할 수 없다 — resolve_listing 이 책 major 를 그대로 파일명에 쓰기 때문이다.
# minor 는 대체로 일치하지만 책 10.18 만 저장소 12.19 다 (저장소 12.18 이 프롬프트라
# 책에서 번호를 못 받아 뒤가 밀렸다). src/ch12/tasks.py 독스트링의 "번호 -2" 주장은
# 이 한 건에서 틀리므로 함께 고쳤다.
#
# symbol 의 특수값 두 개 (노트북 헬퍼가 ast 로 해석한다):
#   __main__   파일 전체 (스크립트, 또는 확장자 없는 Cypher·프롬프트 파일)
#   __entry__  파일의 `if __name__ == '__main__':` 블록만
[mapping.listings.ch12]
"10.2"  = { source = "repo-file", path = "listings/12.3 Computing different types of node degrees in a fraud detection network.py", symbol = "__entry__" }
"10.4"  = { source = "repo-file", path = "listings/12.4 Computing triangle metrics in a fraud detection network.py", symbol = "compute_triangle_metrics" }
"10.6"  = { source = "repo-file", path = "listings/12.6 Computing geodesic path metrics in a fraud detection network.py", symbol = "compute_geodesic_metrics" }
"10.7"  = { source = "repo-file", path = "listings/12.7 Computing closeness centrality in a fraud detection network.py", symbol = "compute_closeness_metrics" }
"10.8"  = { source = "repo-file", path = "listings/12.8 Computing betweenness centrality in a fraud detection network.py", symbol = "compute_betweenness_metrics" }
"10.9"  = { source = "repo-file", path = "listings/12.9 Computing PageRank variations for fraud detection.py", symbol = "compute_pagerank_metrics" }
"10.10" = { source = "repo-file", path = "listings/12.10 Create node features using the metrics described before.py", symbol = "create_node_features_dataset" }
"10.11" = { source = "repo-file", path = "listings/12.11 Train a fraud classifier and evaluate the accuracy.py", symbol = "train_fraud_classifier" }
"10.13" = { source = "repo-file", path = "listings/12.13 All together code to present the results of the entire process.py", symbol = "__entry__" }
"10.14" = { source = "repo-file", path = "listings/12.14 How to combine two nodes representation in one link representation.py", symbol = "__main__" }
"10.15" = { source = "repo-file", path = "listings/12.15 DWPC between Metformin and Type 2 Diabetes for the CbGaD", symbol = "__main__" }
"10.16" = { source = "repo-file", path = "listings/12.16 DWPC value for CbGeAlD", symbol = "__main__" }
"10.17" = { source = "repo-file", path = "listings/12.17 DWPC value for CbGpPWpGaD", symbol = "__main__" }
"10.18" = { source = "repo-file", path = "listings/12.19 ReFeX implementation.py", symbol = "ReFeX" }

# 책 10.5 는 실재하지만 원서 md 에 **코드 스캔 이미지** 로 실려 있어 book_listings() 가
# 잡지 못한다 (원문 L237·L239). 게이트가 요구하지 않지만 사실이므로 선언해 둔다.
"10.5"  = { source = "repo-file", path = "listings/12.5 Computing egonet density in a fraud detection network.py", symbol = "compute_density_metrics", title = "Computing egonet density in a fraud detection network" }

# OpenAI 호환 엔드포인트 설정. 비밀값을 저장소에 복사하지 않고 **참조만** 한다.
# 이 파일은 저장소 밖에 있어 git 에 들어가지 않는다.
# 교재 코드가 OPENAI_KEY / OPENAI_API_KEY 를 섞어 쓰므로 studykit.llm 이 양쪽을 채운다.
[llm]
env_file = "../paperflow/.env"
