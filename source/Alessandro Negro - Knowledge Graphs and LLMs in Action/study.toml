# ch10 의 리스팅 파일은 업스트림 MEAP 번호(12.x)를 쓴다. 책 major(10) 와 다르므로
# listing_offsets 로 표현할 수 없다 — resolve_listing 이 책 major 를 그대로 파일명에 쓰기
# 때문이다. minor 는 대체로 일치하지만 책 10.18 만 파일 12.19 다 (파일 12.18 이 프롬프트라
# 책에서 번호를 못 받아 뒤가 밀렸다). src/ch10/tasks.py 독스트링의 "번호 -2" 주장은
