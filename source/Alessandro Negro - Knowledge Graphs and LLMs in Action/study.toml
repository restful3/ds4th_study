# ch05(업스트림 ch07) 는 리스팅 파일명이 `listing_N.py` 다. 번호 접두사가 아니므로 repo
# 해석 경로를 쓸 수 없다(cypher.find 는 "5.1" 로 시작하는 파일을 찾는다). 게다가 파일 번호 N
# 이 책 minor 와 한 칸 어긋난다 — listing_1.py 는 UBIAI 어노테이션 API 호출인데
# 최종 출간본에는 그 리스팅이 없다(원문 md 에 'ubiai' 가 0회). 그래서 뒤가 전부 밀려
# 파일 N = 책 minor + 1 이다. 짝수 자리(listing_4·6·8)는 GPT 출력 예시라 파일이 없다.
#   파일              책      내용
#   listing_1.py      —       UBIAI API (최종본에서 삭제)
#   listing_2.py      5.1     프롬프트 v1
#   listing_3.py      5.2     OpenAI API 호출
#   (없음)            5.3     5.2 의 GPT 출력
#   listing_5.py      5.4     프롬프트 v2 (관심 엔티티·관계 목록 추가)
#   (없음)            5.5     5.4 의 GPT 출력
#   listing_7.py      5.6     프롬프트 v3 (복잡한 예시)
#   (없음)            5.7     5.6 의 GPT 출력
# 셋 다 함수·클래스가 아니라 모듈 최상위 할당문이므로 symbol = "__main__"(파일 전체)이다.
[mapping.listings.ch05]
"5.1" = { source = "repo-file", path = "listings/listing_2.py", symbol = "__main__" }
"5.2" = { source = "repo-file", path = "listings/listing_3.py", symbol = "__main__" }
"5.3" = { source = "explainer", reason = "book-only" }   # 출력 예시 — 5.2 가 만든다
"5.4" = { source = "repo-file", path = "listings/listing_5.py", symbol = "__main__" }
"5.5" = { source = "explainer", reason = "book-only" }   # 출력 예시 — 5.4 가 만든다
"5.6" = { source = "repo-file", path = "listings/listing_7.py", symbol = "__main__" }
"5.7" = { source = "explainer", reason = "book-only" }   # 출력 예시 — 5.6 이 만든다

# ch06 의 리스팅 파일은 업스트림 MEAP 번호(8.x)를 쓰고 책은 6.x 다. major 가 다르므로
# listing_offsets 로 표현할 수 없다. 파일이 .py 와 .txt 라 cypher.listings() 의 repo 경로도 못 쓴다
# (.py 는 제외되고, .txt 는 잡히지만 번호가 8.2 라 책 6.2 로 찾을 수 없다).
# 6.1 은 모듈 상수 + __main__ 블록이 한 덩어리이고 6.2 는 Cypher 한 문장이라 둘 다 파일 전체다.
[mapping.listings.ch06]
"6.1" = { source = "repo-file", path = "listings/8.1 Normalization of persons and occupations.py", symbol = "__main__" }
"6.2" = { source = "repo-file", path = "listings/8.2 Show influence network related to the cyclotron research.txt", symbol = "__main__" }

# ch13 의 리스팅 파일도 업스트림 MEAP 번호(15.x)를 쓰고 책은 13.x 다. minor 는 일치한다.
# 파일이 전부 `.py` 이고 이름이 "15.N - 제목.py" 라 repo 해석 경로를 쓸 수 없다.
# 13.2·13.4 는 코드가 아니라 출력이다 — 13.2 는 대화 출력, 13.4 는 유사도 상위 두 청크다.
[mapping.listings.ch13]
"13.1" = { source = "repo-file", path = "listings/15.1 - A conversational AI agent with memory.py", symbol = "__main__" }
"13.2" = { source = "explainer", reason = "book-only" }   # 출력 예시 — 13.1 이 만든다
"13.3" = { source = "repo-file", path = "listings/15.3 - Transform documents into embeddings.py", symbol = "__main__" }
"13.4" = { source = "explainer", reason = "book-only" }   # 출력 예시 — 13.3 이 만든다
"13.5" = { source = "repo-file", path = "listings/15.5 - KG-Enhanced Document Retriever tool.py", symbol = "__main__" }
"13.6" = { source = "repo-file", path = "listings/15.6 - ReAct Agent implementing Graph RAG.py", symbol = "__main__" }

# ch15 는 `listings/` 디렉터리가 없다. 코드가 애플리케이션 구조 그대로
# app.py · chains/ · tools/ 에 흩어져 있어 전부 repo-file 로 가리킨다.
# 리스팅 번호는 책과 같다 (major 15 가 우연히 업스트림 MEAP ch17 과 무관하게 일치).
#
# 캡션이 유실된 둘을 여기 선언한다 — 없으면 coverage 게이트가 여분으로 오해한다.
#   15.7  원서 md 에 **코드가 스캔 이미지로** 실려 캡션 줄이 없다 (images/baa1236f….jpg).
#         제목은 그 이미지 안에 인쇄된 "Schema extraction agent" 를 읽었다.
#   15.9  캡션 줄만 사라졌고 코드는 텍스트로 남아 있다. 제목은 원문 절 제목
#         "QUERY EXECUTION AGENT"(해설판 "질의 실행 에이전트")에서 복원한 것이라
#         인쇄된 캡션과 글자까지 같다고 보증할 수 없다.
#
# 15.3·15.6·15.15 만 start/end 다 — 각각 클래스 둘(Property+Node), 메서드 둘
# (run_prompt+intent_detection), 함수 경계가 없는 Streamlit 최상위 블록이라
# 단일 symbol 로 가리킬 수 없다.
[mapping.listings.ch15]
"15.1"  = { source = "repo-file", path = "chains/chain_config.yaml", symbol = "__main__" }
"15.2"  = { source = "repo-file", path = "chains/investigator.py", symbol = "ChainConfiguration" }
"15.3"  = { source = "repo-file", path = "tools/schema.py", start = 8, end = 69 }
"15.4"  = { source = "repo-file", path = "tools/schema.py", symbol = "Neo4jSchema" }
"15.5"  = { source = "repo-file", path = "chains/investigator.py", symbol = "AgentState" }
"15.6"  = { source = "repo-file", path = "chains/investigator.py", start = 113, end = 129 }
"15.7"  = { source = "repo-file", path = "chains/investigator.py", symbol = "Agent.schema_extraction", title = "Schema extraction agent" }
"15.8"  = { source = "repo-file", path = "chains/investigator.py", symbol = "Agent.text_to_cypher" }
"15.9"  = { source = "repo-file", path = "chains/investigator.py", symbol = "Agent.query_execution", title = "Query execution agent" }
"15.10" = { source = "repo-file", path = "chains/investigator.py", symbol = "Agent.post_query_execution" }
"15.11" = { source = "repo-file", path = "chains/investigator.py", symbol = "Agent.generate_summary" }
"15.12" = { source = "repo-file", path = "chains/investigator.py", symbol = "Agent.__init__" }
"15.13" = { source = "repo-file", path = "chains/investigator.py", symbol = "processQuestion" }
"15.14" = { source = "repo-file", path = "app.py", symbol = "MessageHistory" }
"15.15" = { source = "repo-file", path = "app.py", start = 186, end = 230 }

# OpenAI 호환 엔드포인트 설정. 비밀값을 저장소에 복사하지 않고 **참조만** 한다.
# 이 파일은 저장소 밖에 있어 git 에 들어가지 않는다.
# 교재 코드가 OPENAI_KEY / OPENAI_API_KEY 를 섞어 쓰므로 studykit.llm 이 양쪽을 채운다.
[llm]
env_file = "../paperflow/.env"
