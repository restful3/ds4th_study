#
# 노트북을 만들면서 책 코드를 실제로 실행해 얻은 것들이다. 노트북 안에만 두면 검색도
# 중복 제거도 안 되므로 여기 모은다. 각 항목의 `notebook` 이 재현·설명이 있는 곳이다.
#
# status
#   confirmed      실행·측정으로 확정했다
#   editorial      원서 PDF→md 변환이나 편집 과정의 손상 (책 내용 자체는 맞다)
#   version-drift  집필 시점과 지금의 도구·데이터·모델이 달라 생긴 차이 (오류가 아니다)
#   upstream       책이 아니라 저자 코드 저장소의 결함
#   open           불일치는 확정했으나 원인은 미확정
#
# kind
#   code       인쇄된 코드가 그대로는 동작하지 않는다
#   value      인쇄된 수치가 재현되지 않는다
#   semantics  본문 설명이 코드·데이터의 실제 동작과 다르다
#   extraction 캡션·수식이 변환 과정에서 유실·손상됐다
#
# 검증 환경 (달라지면 value 항목을 다시 확인해야 한다)
