# 회차 발표물 push·PR을 검증하고, main에서는 오래된 인덱스를 자동 재생성해 커밋한다 (ml4t pages.yml과 동일 패턴).
# 저장소가 크므로 docs/ + agent-support/만 sparse checkout 한다.
name: Validate study site

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "QUICKSTART.md"
      - "README.md"
      - ".agents/**"
      - ".claude/**"
      - "agent-support/**"
      - "docs/**"
      - ".github/workflows/validate-study-site.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "QUICKSTART.md"
      - "README.md"
      - ".agents/**"
      - ".claude/**"
      - "agent-support/**"
      - "docs/**"
      - ".github/workflows/validate-study-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-study-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            docs
            agent-support

      - name: Compile validation scripts
        run: python3 -m py_compile agent-support/scripts/*.py

      - name: Test site lifecycle and validation
        run: python3 -m unittest discover -s agent-support/tests -v

      - name: Rebuild indexes
        run: python3 agent-support/scripts/build-index.py

      - name: Validate Pages content
        run: python3 agent-support/scripts/validate-site.py

      - name: Commit refreshed indexes (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- docs; then
            echo "indexes already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "ci: rebuild study indexes"
          git pull --rebase origin main
          git push origin HEAD:main
