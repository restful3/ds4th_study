<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">의료 지식 그래프의 노드·관계·속성</title>
  <desc id="desc">약물, 질병, 해부구조, 화합물 개체가 치료한다, 침범한다, 구성한다 관계로 연결되고 각 노드는 속성을 가진다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:Inter,'Noto Sans KR',sans-serif}.h{font-weight:800;font-size:19px}.b{font-size:15px}.m{font-size:13px;fill:#6B6B72}.node{fill:#fff;stroke:#0F2C59;stroke-width:2}.soft{fill:#F2F5F9;stroke:#B7C2D1;stroke-width:1.5}.edge{stroke:#6B6B72;stroke-width:2;marker-end:url(#arrow)}.pill{fill:#0F2C59}</style></defs>
  <rect width="920" height="470" rx="12" fill="#FAFAF9"/>
  <text class="t h" x="34" y="46">의료 지식은 개체 자체가 아니라 개체 사이의 의미 있는 연결에 있다</text>
  <text class="t m" x="34" y="72">노드는 유형이 있는 개체, 엣지는 명시된 관계, 아래 메타 줄은 판단·검증 맥락을 담는 속성이다.</text>
  <line class="edge" x1="252" y1="182" x2="404" y2="182"/><line class="edge" x1="572" y1="182" x2="724" y2="182"/>
  <line class="edge" x1="488" y1="248" x2="488" y2="336"/><line class="edge" x1="254" y1="350" x2="404" y2="222"/>
  <g><rect class="node" x="92" y="132" width="160" height="100" rx="8"/><rect class="pill" x="92" y="132" width="160" height="30" rx="8"/><rect class="pill" x="92" y="153" width="160" height="9"/><text x="172" y="153" text-anchor="middle" fill="#fff" class="t b" font-weight="800">약물 A</text><text class="t m" x="110" y="189">승인일 · 용량</text><text class="t m" x="110" y="212">출처 · 갱신 시각</text></g>
  <g><rect class="node" x="408" y="132" width="160" height="100" rx="8"/><rect class="pill" x="408" y="132" width="160" height="30" rx="8"/><rect class="pill" x="408" y="153" width="160" height="9"/><text x="488" y="153" text-anchor="middle" fill="#fff" class="t b" font-weight="800">질병 B</text><text class="t m" x="426" y="189">분류 코드 · 설명</text><text class="t m" x="426" y="212">동의어 · 다국어</text></g>
  <g><rect class="node" x="726" y="132" width="152" height="100" rx="8"/><rect class="pill" x="726" y="132" width="152" height="30" rx="8"/><rect class="pill" x="726" y="153" width="152" height="9"/><text x="802" y="153" text-anchor="middle" fill="#fff" class="t b" font-weight="800">해부구조 C</text><text class="t m" x="744" y="189">위치 · 기능</text><text class="t m" x="744" y="212">영상 소견</text></g>
  <g><rect class="node" x="408" y="338" width="160" height="90" rx="8"/><text x="488" y="374" text-anchor="middle" class="t h">화합물 D</text><text x="488" y="400" text-anchor="middle" class="t m">분자식 · 표적</text></g>
  <g><rect class="soft" x="298" y="153" width="96" height="24" rx="12"/><text x="346" y="170" text-anchor="middle" class="t m">치료한다</text>
     <rect class="soft" x="618" y="153" width="96" height="24" rx="12"/><text x="666" y="170" text-anchor="middle" class="t m">침범한다</text>
     <rect class="soft" x="500" y="270" width="88" height="24" rx="12"/><text x="544" y="287" text-anchor="middle" class="t m">구성한다</text>
     <rect class="soft" x="286" y="276" width="82" height="24" rx="12"/><text x="327" y="293" text-anchor="middle" class="t m">표적한다</text></g>
  <g transform="translate(92 408)"><circle cx="8" cy="8" r="7" fill="#0F2C59"/><text class="t m" x="24" y="13">노드 = 유형이 있는 현실 개체</text><line x1="258" y1="8" x2="298" y2="8" class="edge"/><text class="t m" x="314" y="13">관계 = 의미가 명시된 연결</text><rect class="soft" x="606" y="-4" width="38" height="24" rx="4"/><text class="t m" x="660" y="13">속성 = 해석·검증 맥락</text></g>
</svg>
