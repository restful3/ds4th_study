<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">의료 지식 그래프의 노드·관계·속성</title>
  <desc id="desc">약물, 질병, 해부구조, 화합물 개체가 치료에 사용된다, 침범한다, 유효성분이다 관계로 연결되고 각 노드는 속성을 가진다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.h{font-weight:800;font-size:19px}.b{font-size:15px}.m{font-size:13px;fill:#6B6B72}.node{fill:#fff;stroke:#0F2C59;stroke-width:2}.soft{fill:#F2F5F9;stroke:#B7C2D1;stroke-width:1.5}.edge{stroke:#6B6B72;stroke-width:2;marker-end:url(#arrow)}.pill{fill:#0F2C59}</style></defs>
  <rect width="920" height="470" rx="12" fill="#FAFAF9"/>
  <text class="t h" x="34" y="46">의료 지식은 개체 자체가 아니라 개체 사이의 의미 있는 연결에 있다</text>
  <text class="t m" x="34" y="72">노드는 유형이 있는 개체, 엣지는 명시된 관계, 아래 메타 줄은 판단·검증 맥락을 담는 속성이다.</text>
  <g><rect class="node" x="72" y="132" width="160" height="100" rx="8"/><rect class="pill" x="72" y="132" width="160" height="30" rx="8"/><rect class="pill" x="72" y="153" width="160" height="9"/><text x="152" y="153" text-anchor="middle" fill="#fff" class="t b" font-weight="800">약물 A</text><text class="t m" x="90" y="189">승인일 · 용량</text><text class="t m" x="90" y="212">출처 · 갱신 시각</text></g>
  <g><rect class="node" x="380" y="132" width="160" height="100" rx="8"/><rect class="pill" x="380" y="132" width="160" height="30" rx="8"/><rect class="pill" x="380" y="153" width="160" height="9"/><text x="460" y="153" text-anchor="middle" fill="#fff" class="t b" font-weight="800">질병 B</text><text class="t m" x="398" y="189">분류 코드 · 설명</text><text class="t m" x="398" y="212">동의어 · 다국어</text></g>
  <g><rect class="node" x="688" y="132" width="160" height="100" rx="8"/><rect class="pill" x="688" y="132" width="160" height="30" rx="8"/><rect class="pill" x="688" y="153" width="160" height="9"/><text x="768" y="153" text-anchor="middle" fill="#fff" class="t b" font-weight="800">해부구조 C</text><text class="t m" x="706" y="189">위치 · 기능</text><text class="t m" x="706" y="212">영상 소견</text></g>
  <g><rect class="node" x="380" y="318" width="160" height="78" rx="8"/><text x="460" y="350" text-anchor="middle" class="t h">화합물 D</text><text x="460" y="376" text-anchor="middle" class="t m">분자식 · 표적</text></g>
  <line class="edge" x1="232" y1="182" x2="376" y2="182"/><line class="edge" x1="540" y1="182" x2="684" y2="182"/>
  <path class="edge" fill="none" d="M380 350C308 350 300 214 236 198"/>
  <line class="edge" x1="460" y1="318" x2="460" y2="236"/>
  <g><rect class="soft" x="258" y="153" width="96" height="24" rx="12"/><text x="306" y="170" text-anchor="middle" class="t m">치료에 사용</text>
     <rect class="soft" x="566" y="153" width="96" height="24" rx="12"/><text x="614" y="170" text-anchor="middle" class="t m">침범한다</text>
     <rect class="soft" x="474" y="260" width="100" height="24" rx="12"/><text x="524" y="277" text-anchor="middle" class="t m">치료에 사용</text>
     <rect class="soft" x="264" y="268" width="106" height="24" rx="12"/><text x="317" y="285" text-anchor="middle" class="t m">유효성분이다</text></g>
  <g transform="translate(72 425)"><circle cx="8" cy="8" r="7" fill="#0F2C59"/><text class="t m" x="24" y="13">노드 = 유형이 있는 현실 개체</text><line x1="258" y1="8" x2="298" y2="8" class="edge"/><text class="t m" x="314" y="13">관계 = 의미가 명시된 연결</text><rect class="soft" x="606" y="-4" width="38" height="24" rx="4"/><text class="t m" x="660" y="13">속성 = 해석·검증 맥락</text></g>
</svg>
