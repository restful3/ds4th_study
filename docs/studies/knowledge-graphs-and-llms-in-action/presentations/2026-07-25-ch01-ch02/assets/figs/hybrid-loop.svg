<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">하이브리드 추론 엔진과 피드백 루프</title>
  <desc id="desc">사용자 요청에서 시작해 KG 규칙의 연역, 기계학습의 귀납, LLM의 확률적 추론을 결합한 엔진이 조치를 제안하고, 환경 변화와 새 관찰이 지식 베이스를 갱신하며 순환한다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:15px;font-weight:800}.b{font-size:12.5px}.m{font-size:12px;fill:#6B6B72}.box{fill:#fff;stroke:#B7C2D1;stroke-width:1.5}.soft{fill:#F2F5F9;stroke:#B7C2D1;stroke-width:1.5}.navy{fill:#0F2C59}.line{stroke:#6B6B72;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#6B6B72;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#a)}</style></defs>
  <rect width="920" height="470" rx="12" fill="#FAFAF9"/>
  <text class="t h" x="34" y="44">추론 엔진은 지식 베이스를 읽고 쓰며 조치→관찰을 순환시킨다</text>
  <text class="t m" x="34" y="68">명시적 규칙, 학습한 패턴, 언어모델의 확률적 제안을 결합하되 각 결과의 성격을 구분한다.</text>
  <rect class="navy" x="358" y="112" width="204" height="98" rx="10"/><text x="460" y="146" text-anchor="middle" fill="#fff" class="t sh">추론 엔진</text><text x="460" y="172" text-anchor="middle" fill="#fff" opacity=".8" class="t b">KG·규칙(연역) · ML(귀납)</text><text x="460" y="193" text-anchor="middle" fill="#fff" opacity=".8" class="t b">LLM(확률적 제안)</text>
  <g class="t" text-anchor="middle">
    <rect class="box" x="83" y="122" width="150" height="78" rx="8"/><text x="158" y="154" class="b" font-weight="700">사용자 요청</text><text x="158" y="176" class="m">목표 · 추가 정보</text>
    <rect class="box" x="687" y="122" width="150" height="78" rx="8"/><text x="762" y="154" class="b" font-weight="700">조치 · 제안</text><text x="762" y="176" class="m">우선순위 권고</text>
    <rect class="box" x="674" y="300" width="176" height="72" rx="8"/><text x="762" y="332" class="b" font-weight="700">환경</text><text x="762" y="354" class="m">제안이 실행됨</text>
    <rect class="box" x="372" y="300" width="176" height="72" rx="8"/><text x="460" y="332" class="b" font-weight="700">새 관찰</text><text x="460" y="354" class="m">결과 · 반응</text>
    <rect class="soft" x="70" y="300" width="176" height="72" rx="8"/><text x="158" y="332" class="b" font-weight="700">지식 베이스</text><text x="158" y="354" class="m">비용 · 확률 관계 · 선호</text>
  </g>
  <path class="line" d="M233 161H354"/><text x="294" y="150" class="t m" text-anchor="middle">입력</text>
  <path class="line" d="M562 161H683"/><text x="623" y="150" class="t m" text-anchor="middle">제안</text>
  <path class="line" d="M762 200V296"/><text x="779" y="252" class="t m">실행</text>
  <path class="line" d="M674 336H552"/>
  <path class="dash" d="M460 300V214"/><text x="476" y="261" class="t m">새 지식</text>
  <path class="line" d="M246 320C292 286 310 188 354 178"/>
  <path class="line" d="M354 196C314 214 298 310 250 340"/>
  <rect class="soft" x="254" y="244" width="92" height="26" rx="13"/><text x="300" y="262" class="t m" text-anchor="middle">읽기 · 쓰기</text>
  <text class="t m" x="460" y="446" text-anchor="middle">순수 연역은 완전한 KB를 요구해 비현실적 · ML은 KB를 확장·일반화 · LLM은 빈틈을 확률적으로 메운다.</text>
</svg>
