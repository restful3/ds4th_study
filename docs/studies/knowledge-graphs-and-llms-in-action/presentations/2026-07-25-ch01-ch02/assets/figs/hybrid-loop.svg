<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">하이브리드 추론 엔진과 피드백 루프</title>
  <desc id="desc">사용자 요청에서 시작해 KG 규칙과 LLM 확률을 결합한 추론 엔진이 조치를 제안하고, 환경 변화와 새 관찰이 지식 베이스를 갱신하며 순환한다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:Inter,'Noto Sans KR',sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:15px;font-weight:800}.b{font-size:12.5px}.m{font-size:12px;fill:#6B6B72}.box{fill:#fff;stroke:#B7C2D1;stroke-width:1.5}.soft{fill:#F2F5F9;stroke:#B7C2D1;stroke-width:1.5}.navy{fill:#0F2C59}.line{stroke:#6B6B72;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#6B6B72;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#a)}</style></defs>
  <rect width="920" height="470" rx="12" fill="#FAFAF9"/>
  <text class="t h" x="34" y="44">추론 엔진은 지식 베이스를 읽고 쓰며 조치→관찰을 순환시킨다</text>
  <text class="t m" x="34" y="68">KG의 규칙 기반 추론과 LLM의 확률적 추론을 한 엔진에서 결합해, 정보가 불완전해도 제안을 만든다.</text>
  <rect class="navy" x="358" y="112" width="204" height="98" rx="10"/><text x="460" y="150" text-anchor="middle" fill="#fff" class="t sh">추론 엔진</text><text x="460" y="176" text-anchor="middle" fill="#fff" opacity=".8" class="t b">KG 규칙(연역·귀납)</text><text x="460" y="196" text-anchor="middle" fill="#fff" opacity=".8" class="t b">+ LLM 확률</text>
  <g class="t" text-anchor="middle">
    <rect class="box" x="70" y="122" width="150" height="78" rx="8"/><text x="145" y="154" class="b" font-weight="700">사용자 요청</text><text x="145" y="176" class="m">목표 · 추가 정보</text>
    <rect class="box" x="720" y="122" width="150" height="78" rx="8"/><text x="795" y="154" class="b" font-weight="700">조치 · 제안</text><text x="795" y="176" class="m">우선순위 권고</text>
    <rect class="box" x="716" y="300" width="150" height="72" rx="8"/><text x="791" y="332" class="b" font-weight="700">환경</text><text x="791" y="354" class="m">제안이 실행됨</text>
    <rect class="box" x="386" y="330" width="160" height="72" rx="8"/><text x="466" y="362" class="b" font-weight="700">새 관찰</text><text x="466" y="384" class="m">결과 · 반응</text>
    <rect class="soft" x="72" y="300" width="176" height="72" rx="8"/><text x="160" y="332" class="b" font-weight="700">지식 베이스</text><text x="160" y="354" class="m">비용 · 확률 관계 · 선호</text>
  </g>
  <path class="line" d="M220 161H354"/><text x="285" y="150" class="t m" text-anchor="middle">입력</text>
  <path class="line" d="M562 161H716"/><text x="639" y="150" class="t m" text-anchor="middle">제안</text>
  <path class="line" d="M795 200V296"/><text x="812" y="252" class="t m">실행</text>
  <path class="line" d="M716 344L550 366"/>
  <path class="dash" d="M466 330V214"/><text x="482" y="272" class="t m">새 지식</text>
  <path class="line" d="M248 322C300 300 320 240 358 200"/>
  <path class="line" d="M366 210C328 250 300 300 250 330" stroke="#6B6B72"/>
  <text x="300" y="270" class="t m" transform="rotate(-2 300 270)">읽기 · 쓰기</text>
  <text class="t m" x="460" y="446" text-anchor="middle">순수 연역은 완전한 KB를 요구해 비현실적 · ML은 KB를 확장·일반화 · LLM은 빈틈을 확률적으로 메운다.</text>
</svg>
