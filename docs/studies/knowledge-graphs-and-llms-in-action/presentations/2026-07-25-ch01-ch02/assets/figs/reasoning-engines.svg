<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">연역 추론과 귀납 추론의 정보 흐름 비교</title>
  <desc id="desc">연역 추론은 데이터를 직접 사용할 수 있는 논리 지식 베이스로 변환해 규칙을 적용하며, 귀납 추론은 기계학습으로 지식 베이스를 만들거나 확장하고 불완전한 정보에서 일반화한다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker>
    <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:13px;font-weight:800}.m{font-size:11.5px;fill:#6B6B72}.card{fill:#fff;stroke:#B7C2D1;stroke-width:1.5}.box{fill:#F2F5F9;stroke:#B7C2D1;stroke-width:1.5}.navy{fill:#0F2C59}.line{stroke:#6B6B72;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#8793A3;stroke-width:1.7;fill:none;stroke-dasharray:5 5;marker-end:url(#a)}.warn{fill:#FFF5E6;stroke:#D9A441;stroke-width:1.4}</style>
  </defs>
  <rect width="920" height="500" rx="12" fill="#FAFAF9"/>
  <text class="t h" x="34" y="44">연역은 보장 조건이 강하고, 귀납은 불완전한 세계에서 일반화한다</text>
  <text class="t m" x="34" y="68">두 엔진은 경쟁 관계가 아니라 서로 다른 증거와 불확실성을 다루는 역할 분담이다.</text>

  <rect class="card" x="30" y="98" width="420" height="354" rx="11"/><rect class="card" x="470" y="98" width="420" height="354" rx="11"/>
  <text class="t sh" x="50" y="126" fill="#0F2C59">연역 추론 — 규칙과 전제가 참이면 결론 보장</text><text class="t sh" x="490" y="126" fill="#0F2C59">귀납·ML — 관찰에서 패턴을 추상화해 예측</text>

  <g class="t" text-anchor="middle">
    <rect class="box" x="50" y="154" width="104" height="70" rx="8"/><text x="102" y="181" class="sh">데이터 소스</text><text x="102" y="202" class="m">기록 · 문헌</text>
    <rect class="box" x="188" y="154" width="104" height="70" rx="8"/><text x="240" y="181" class="sh">직접 변환</text><text x="240" y="202" class="m">논리 문장</text>
    <rect class="box" x="326" y="154" width="104" height="70" rx="8"/><text x="378" y="181" class="sh">지식 베이스</text><text x="378" y="202" class="m">완전·정확 요구</text>

    <rect class="navy" x="188" y="270" width="104" height="70" rx="8"/><text x="240" y="297" fill="#fff" class="sh">연역 엔진</text><text x="240" y="318" style="fill:#fff" opacity=".75" class="m">명시적 규칙</text>
    <rect class="box" x="326" y="270" width="104" height="70" rx="8"/><text x="378" y="297" class="sh">조치 · 제안</text><text x="378" y="318" class="m">논리적 결론</text>

    <rect class="box" x="490" y="154" width="104" height="70" rx="8"/><text x="542" y="181" class="sh">다양한 데이터</text><text x="542" y="202" class="m">텍스트 · 벡터</text>
    <rect class="navy" x="628" y="154" width="104" height="70" rx="8"/><text x="680" y="181" fill="#fff" class="sh">KB 구성</text><text x="680" y="202" style="fill:#fff" opacity=".75" class="m">ML · NLP</text>
    <rect class="box" x="766" y="154" width="104" height="70" rx="8"/><text x="818" y="181" class="sh">지식 베이스</text><text x="818" y="202" class="m">구성 · 확장</text>

    <rect class="navy" x="628" y="270" width="104" height="70" rx="8"/><text x="680" y="297" fill="#fff" class="sh">귀납 엔진</text><text x="680" y="318" style="fill:#fff" opacity=".75" class="m">추상화 · 일반화</text>
    <rect class="box" x="766" y="270" width="104" height="70" rx="8"/><text x="818" y="297" class="sh">조치 · 제안</text><text x="818" y="318" class="m">확률적 예측</text>
  </g>
  <path class="line" d="M154 189H184"/><path class="line" d="M292 189H322"/>
  <path class="line" d="M378 224V250H240V266"/><path class="line" d="M292 305H322"/>
  <path class="line" d="M594 189H624"/><path class="line" d="M732 189H762"/>
  <path class="line" d="M818 224V246H680V266"/><path class="line" d="M732 305H762"/>
  <path class="dash" d="M680 340V356H878V134H842V153"/>

  <rect class="warn" x="50" y="372" width="380" height="54" rx="8"/><text class="t sh" x="240" y="395" text-anchor="middle">한계: 필요한 사실이 빠지거나 틀리면 결론도 무너진다</text><text class="t m" x="240" y="414" text-anchor="middle">대부분의 경우 결과를 KB에 자동 저장하지 않는 단방향 흐름</text>
  <rect class="warn" x="490" y="372" width="380" height="54" rx="8"/><text class="t sh" x="680" y="395" text-anchor="middle">장점과 한계: 빈틈을 일반화하지만 결과는 틀릴 수 있다</text><text class="t m" x="680" y="414" text-anchor="middle">학습 결과가 KB를 만들거나 확장하며 환경 피드백으로 갱신</text>
  <text class="t m" x="460" y="480" text-anchor="middle">LLM의 확률적 추론은 귀납과 유사하게 불완전한 입력을 다루지만, 생성한 설명을 검증된 사실과 동일시해서는 안 된다.</text>
</svg>
