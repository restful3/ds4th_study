<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">신약 발견과 고객 지원의 공통 하이브리드 패턴</title><desc id="desc">두 사례가 다른 도메인 데이터를 사용하지만 관계 중심 지식, 비정형 문서, 자연어 접근이라는 동일한 결합 패턴을 가진다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:Inter,'Noto Sans KR',sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:15px;font-weight:800}.b{font-size:13px}.m{font-size:12px;fill:#6B6B72}.box{fill:#fff;stroke:#B7C2D1;stroke-width:1.5}.soft{fill:#F2F5F9;stroke:#0F2C59;stroke-width:1.5}.navy{fill:#0F2C59}.line{stroke:#6B6B72;stroke-width:2;marker-end:url(#a)}</style></defs>
  <rect width="920" height="470" rx="12" fill="#FAFAF9"/><text class="t h" x="34" y="44">도메인은 달라도 결합 가치가 생기는 문제의 모양은 같다</text><text class="t m" x="34" y="68">관계를 따라 답을 찾아야 하고, 비정형 근거가 많으며, 사용자는 자연어로 접근하고 싶을 때다.</text>
  <g transform="translate(48 104)"><rect class="box" width="300" height="230" rx="9"/><text class="t sh" x="24" y="36">신약 발견·개발</text><line x1="24" y1="53" x2="276" y2="53" stroke="#B7C2D1"/><text class="t b" x="24" y="82">관계 중심 지식</text><text class="t m" x="24" y="105">유전자 ↔ 단백질 ↔ 질병 ↔ 약물</text><text class="t b" x="24" y="138">비정형 근거</text><text class="t m" x="24" y="161">논문 · 임상 보고서 · 특허</text><text class="t b" x="24" y="194">사용자 질문</text><text class="t m" x="24" y="217">“이 표적과 연결된 후보 약물은?”</text></g>
  <g transform="translate(572 104)"><rect class="box" width="300" height="230" rx="9"/><text class="t sh" x="24" y="36">고객 지원·대화형 AI</text><line x1="24" y1="53" x2="276" y2="53" stroke="#B7C2D1"/><text class="t b" x="24" y="82">관계 중심 지식</text><text class="t m" x="24" y="105">고객 ↔ 제품 ↔ 계약 ↔ 정책</text><text class="t b" x="24" y="138">비정형 근거</text><text class="t m" x="24" y="161">매뉴얼 · 상담 기록 · 공지</text><text class="t b" x="24" y="194">사용자 질문</text><text class="t m" x="24" y="217">“내 계약에서 이 변경이 가능한가?”</text></g>
  <line class="line" x1="348" y1="219" x2="410" y2="219"/><line class="line" x1="572" y1="219" x2="510" y2="219"/>
  <g transform="translate(410 137)"><rect class="navy" width="100" height="164" rx="9"/><text x="50" y="35" text-anchor="middle" fill="#fff" class="t sh">공통 패턴</text><text x="50" y="69" text-anchor="middle" fill="#fff" opacity=".78" class="t m">LLM 추출</text><text x="50" y="96" text-anchor="middle" fill="#fff" opacity=".78" class="t m">KG 연결</text><text x="50" y="123" text-anchor="middle" fill="#fff" opacity=".78" class="t m">경로 검색</text><text x="50" y="150" text-anchor="middle" fill="#fff" opacity=".78" class="t m">근거 응답</text></g>
  <g transform="translate(132 375)"><rect class="soft" width="656" height="52" rx="7"/><text class="t sh" x="328" y="32" text-anchor="middle">적합 신호: 이질적 데이터 + 다중 홉 관계 + 최신성·설명성 + 자연어 접근</text></g>
</svg>
