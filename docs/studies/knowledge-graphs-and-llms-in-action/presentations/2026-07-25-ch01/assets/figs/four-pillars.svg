<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">지식 그래프의 네 기둥</title><desc id="desc">진화, 의미, 통합, 학습 네 기둥이 단일 신뢰 원천과 여러 애플리케이션을 연결한다.</desc>
  <defs><style>.t{font-family:Inter,'Noto Sans KR',sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:15px;font-weight:800}.b{font-size:13px}.m{font-size:12px;fill:#6B6B72}.box{fill:#fff;stroke:#B7C2D1;stroke-width:1.5}.soft{fill:#F2F5F9}.navy{fill:#0F2C59}.line{stroke:#B7C2D1;stroke-width:2}</style></defs>
  <rect width="920" height="430" rx="12" fill="#FAFAF9"/><text class="t h" x="34" y="44">네 기둥은 그래프 저장소를 ‘살아 있는 지식 계층’으로 바꾼다</text><text class="t m" x="34" y="68">한 기둥만 강해서는 충분하지 않다. 변화·의미·통합·학습이 함께 작동해야 여러 앱이 지식을 재사용한다.</text>
  <rect class="navy" x="90" y="112" width="740" height="52" rx="7"/><text x="460" y="144" text-anchor="middle" fill="#fff" class="t sh">여러 애플리케이션 · 여러 질문 · 여러 사용자</text>
  <line class="line" x1="174" y1="164" x2="174" y2="300"/><line class="line" x1="365" y1="164" x2="365" y2="300"/><line class="line" x1="555" y1="164" x2="555" y2="300"/><line class="line" x1="746" y1="164" x2="746" y2="300"/>
  <g transform="translate(96 188)"><rect class="box" width="156" height="122" rx="8"/><text class="t sh" x="78" y="34" text-anchor="middle">진화</text><text class="t m" x="78" y="60" text-anchor="middle">새 사실을 계속 흡수</text><text class="t m" x="78" y="81" text-anchor="middle">부분 구조를 확장</text><text class="t m" x="78" y="102" text-anchor="middle">시간에 따른 변화</text></g>
  <g transform="translate(287 188)"><rect class="box" width="156" height="122" rx="8"/><text class="t sh" x="78" y="34" text-anchor="middle">의미</text><text class="t m" x="78" y="60" text-anchor="middle">유형·관계 정의</text><text class="t m" x="78" y="81" text-anchor="middle">일관성 검사</text><text class="t m" x="78" y="102" text-anchor="middle">설명·추론의 근거</text></g>
  <g transform="translate(477 188)"><rect class="box" width="156" height="122" rx="8"/><text class="t sh" x="78" y="34" text-anchor="middle">통합</text><text class="t m" x="78" y="60" text-anchor="middle">다른 형식·출처 연결</text><text class="t m" x="78" y="81" text-anchor="middle">동일 개체 정렬</text><text class="t m" x="78" y="102" text-anchor="middle">사일로 해소</text></g>
  <g transform="translate(668 188)"><rect class="box" width="156" height="122" rx="8"/><text class="t sh" x="78" y="34" text-anchor="middle">학습</text><text class="t m" x="78" y="60" text-anchor="middle">패턴·경로 발견</text><text class="t m" x="78" y="81" text-anchor="middle">규칙·ML 결합</text><text class="t m" x="78" y="102" text-anchor="middle">새 통찰 생성</text></g>
  <rect class="soft" x="90" y="342" width="740" height="48" rx="7"/><text class="t sh" x="460" y="372" text-anchor="middle">공유되는 지식의 신뢰 원천 · 식별자 · 출처 · 검증 규칙</text>
</svg>
