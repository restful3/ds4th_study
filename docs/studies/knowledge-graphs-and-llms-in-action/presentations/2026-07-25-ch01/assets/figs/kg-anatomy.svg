<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">지식 그래프의 노드, 관계, 속성 구조</title>
  <desc id="desc">약물, 질병, 증상, 단백질 노드와 치료한다, 유발한다, 표적한다 관계 및 속성의 연결을 보여준다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:Inter,'Noto Sans KR',sans-serif}.h{font-weight:800;font-size:19px}.b{font-size:15px}.m{font-size:13px;fill:#6B6B72}.node{fill:#fff;stroke:#0F2C59;stroke-width:2}.soft{fill:#F2F5F9;stroke:#B7C2D1;stroke-width:1.5}.edge{stroke:#6B6B72;stroke-width:2;marker-end:url(#arrow)}.pill{fill:#0F2C59}</style></defs>
  <rect width="920" height="470" rx="12" fill="#FAFAF9"/>
  <text class="t h" x="34" y="46">의료 지식은 ‘대상’보다 ‘의미 있는 연결’에서 작동한다</text>
  <text class="t m" x="34" y="72">노드는 개체, 엣지는 관계, 작은 메타 블록은 판단 맥락을 담는 속성이다.</text>
  <line class="edge" x1="248" y1="180" x2="406" y2="180"/><line class="edge" x1="566" y1="180" x2="726" y2="180"/>
  <line class="edge" x1="488" y1="245" x2="488" y2="336"/><line class="edge" x1="250" y1="350" x2="405" y2="220"/>
  <g><rect class="node" x="90" y="130" width="160" height="100" rx="8"/><rect class="pill" x="90" y="130" width="160" height="30" rx="8"/><rect class="pill" x="90" y="151" width="160" height="9"/><text x="170" y="151" text-anchor="middle" fill="#fff" class="t b" font-weight="800">약물 A</text><text class="t m" x="108" y="187">승인일 · 용량</text><text class="t m" x="108" y="210">출처 · 갱신 시각</text></g>
  <g><rect class="node" x="408" y="130" width="160" height="100" rx="8"/><rect class="pill" x="408" y="130" width="160" height="30" rx="8"/><rect class="pill" x="408" y="151" width="160" height="9"/><text x="488" y="151" text-anchor="middle" fill="#fff" class="t b" font-weight="800">질병 B</text><text class="t m" x="426" y="187">질병 분류 · 설명</text><text class="t m" x="426" y="210">동의어 · 코드</text></g>
  <g><rect class="node" x="728" y="130" width="150" height="100" rx="8"/><rect class="pill" x="728" y="130" width="150" height="30" rx="8"/><rect class="pill" x="728" y="151" width="150" height="9"/><text x="803" y="151" text-anchor="middle" fill="#fff" class="t b" font-weight="800">증상 C</text><text class="t m" x="746" y="187">중증도 · 빈도</text><text class="t m" x="746" y="210">관찰 조건</text></g>
  <g><rect class="node" x="408" y="338" width="160" height="88" rx="8"/><text x="488" y="373" text-anchor="middle" class="t h">단백질 D</text><text x="488" y="399" text-anchor="middle" class="t m">유전자 · 기능</text></g>
  <g><rect class="soft" x="297" y="151" width="90" height="24" rx="12"/><text x="342" y="168" text-anchor="middle" class="t m">치료한다</text><rect class="soft" x="615" y="151" width="90" height="24" rx="12"/><text x="660" y="168" text-anchor="middle" class="t m">유발한다</text><rect class="soft" x="505" y="272" width="82" height="24" rx="12"/><text x="546" y="289" text-anchor="middle" class="t m">연관된다</text><rect class="soft" x="287" y="278" width="78" height="24" rx="12"/><text x="326" y="295" text-anchor="middle" class="t m">표적한다</text></g>
  <g transform="translate(90 406)"><circle cx="8" cy="8" r="7" fill="#0F2C59"/><text class="t m" x="24" y="13">노드 = 유형이 있는 현실 개체</text><line x1="260" y1="8" x2="300" y2="8" class="edge"/><text class="t m" x="316" y="13">관계 = 의미가 명시된 연결</text><rect class="soft" x="610" y="-4" width="38" height="24" rx="4"/><text class="t m" x="664" y="13">속성 = 해석·검증 맥락</text></g>
</svg>
