<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">정형 데이터와 비정형 데이터의 지식 그래프 구축 난이도 비교</title><desc id="desc">정형 데이터는 예측 가능한 매핑을 거치지만 비정형 데이터는 언어, 오타, 상호참조, 문체, 전문용어 해석을 거친 뒤 개체와 관계 후보가 된다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:Inter,'Noto Sans KR',sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:15px;font-weight:800}.b{font-size:14px}.m{font-size:12px;fill:#6B6B72}.box{fill:#fff;stroke:#B7C2D1;stroke-width:1.5}.navy{fill:#0F2C59}.line{stroke:#6B6B72;stroke-width:2;marker-end:url(#a)}.dash{stroke:#B7C2D1;stroke-width:1.5;stroke-dasharray:5 5}</style></defs>
  <rect width="920" height="460" rx="12" fill="#FAFAF9"/><text class="t h" x="34" y="45">병목은 저장이 아니라 ‘해석 가능한 사실’로 바꾸는 과정이다</text><text class="t m" x="34" y="69">같은 그래프 스키마로 들어가더라도 원천 데이터의 구조성에 따라 작업량이 크게 달라진다.</text>
  <g transform="translate(34 100)"><rect class="box" width="205" height="128" rx="8"/><text class="t sh" x="18" y="29">정형·반정형</text><text class="t b" x="18" y="57">테이블 · CSV · JSON</text><text class="t m" x="18" y="83">필드·유형·식별자가 이미 분리</text><text class="t m" x="18" y="105">예측 가능한 스키마 매핑</text></g>
  <line class="line" x1="239" y1="164" x2="367" y2="164"/><rect class="box" x="371" y="124" width="176" height="80" rx="8"/><text class="t sh" x="459" y="154" text-anchor="middle">공통 스키마 매핑</text><text class="t m" x="459" y="180" text-anchor="middle">필드 → 노드·관계·속성</text><line class="line" x1="547" y1="164" x2="700" y2="164"/>
  <g transform="translate(34 270)"><rect class="box" width="205" height="142" rx="8"/><text class="t sh" x="18" y="29">비정형 텍스트</text><text class="t b" x="18" y="57">문서 · 대화 · 논문</text><text class="t m" x="18" y="84">표현과 문맥이 문장 안에 결합</text><text class="t m" x="18" y="106">개체·관계의 경계가 숨겨짐</text><text class="t m" x="18" y="128">도메인마다 의미가 달라짐</text></g>
  <line class="line" x1="239" y1="341" x2="300" y2="341"/>
  <g transform="translate(305 264)"><rect class="box" width="310" height="154" rx="8"/><text class="t sh" x="18" y="28">언어 해석의 다섯 장애물</text><g class="t b"><text x="18" y="58">01 여러 언어와 문자 체계</text><text x="165" y="58">02 오타·맞춤법</text><text x="18" y="87">03 대명사·상호참조</text><text x="165" y="87">04 문체·동의어</text><text x="18" y="116">05 도메인 전문 용어</text></g><text class="t m" x="18" y="140">LLM은 후보 추출을 낮추지만 검증 책임을 없애지는 않는다.</text></g>
  <line class="line" x1="615" y1="341" x2="700" y2="341"/>
  <g transform="translate(704 112)"><rect class="navy" width="182" height="254" rx="8"/><text x="91" y="38" text-anchor="middle" fill="#fff" class="t sh">지식 그래프</text><line x1="22" y1="57" x2="160" y2="57" stroke="#fff" opacity=".28"/><text x="24" y="89" fill="#fff" class="t b">개체 식별</text><text x="24" y="121" fill="#fff" class="t b">관계 유형화</text><text x="24" y="153" fill="#fff" class="t b">출처·시간 기록</text><text x="24" y="185" fill="#fff" class="t b">중복·충돌 검증</text><text x="24" y="217" fill="#fff" class="t b">공통 의미로 통합</text><text x="91" y="239" text-anchor="middle" fill="#fff" opacity=".72" class="t m">검증된 사실 계층</text></g>
  <line class="dash" x1="650" y1="240" x2="650" y2="412"/><text class="t m" x="665" y="416">정확성 게이트</text>
</svg>
