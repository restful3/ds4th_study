<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">과제별 모델에서 전이 학습 기반 범용 모델로의 전환</title><desc id="desc">여러 과제별 데이터와 모델을 각각 개발하던 방식이 대규모 사전학습 후 프롬프트와 소량 조정으로 여러 과제에 재사용되는 방식으로 바뀌는 모습을 보여준다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:Inter,'Noto Sans KR',sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:15px;font-weight:800}.b{font-size:13px}.m{font-size:12px;fill:#6B6B72}.box{fill:#fff;stroke:#B7C2D1;stroke-width:1.5}.soft{fill:#F2F5F9;stroke:#0F2C59;stroke-width:1.5}.navy{fill:#0F2C59}.line{stroke:#6B6B72;stroke-width:1.8;marker-end:url(#a)}</style></defs>
  <rect width="920" height="420" rx="12" fill="#FAFAF9"/><text class="t h" x="34" y="44">전이 학습은 ‘과제마다 새 모델’이라는 비용 구조를 바꿨다</text><text class="t m" x="34" y="68">사전학습에서 얻은 언어 패턴을 개체 추출·관계 추출·질의 변환·요약에 재사용한다.</text>
  <text class="t sh" x="34" y="112">이전: 과제별 파이프라인</text><g transform="translate(34 132)"><rect class="box" width="156" height="48" rx="6"/><text class="t b" x="78" y="29" text-anchor="middle">라벨 데이터 A</text><line class="line" x1="156" y1="24" x2="210" y2="24"/><rect class="box" x="214" width="150" height="48" rx="6"/><text class="t b" x="289" y="29" text-anchor="middle">개체 추출 모델</text><rect class="box" y="66" width="156" height="48" rx="6"/><text class="t b" x="78" y="95" text-anchor="middle">라벨 데이터 B</text><line class="line" x1="156" y1="90" x2="210" y2="90"/><rect class="box" x="214" y="66" width="150" height="48" rx="6"/><text class="t b" x="289" y="95" text-anchor="middle">관계 추출 모델</text><rect class="box" y="132" width="156" height="48" rx="6"/><text class="t b" x="78" y="161" text-anchor="middle">라벨 데이터 C</text><line class="line" x1="156" y1="156" x2="210" y2="156"/><rect class="box" x="214" y="132" width="150" height="48" rx="6"/><text class="t b" x="289" y="161" text-anchor="middle">분류·요약 모델</text></g>
  <line x1="435" y1="108" x2="435" y2="352" stroke="#B7C2D1" stroke-dasharray="5 5"/><text class="t sh" x="472" y="112">이후: 사전학습 역량의 재사용</text>
  <g transform="translate(472 132)"><rect class="navy" width="188" height="180" rx="8"/><text x="94" y="36" text-anchor="middle" fill="#fff" class="t sh">대규모 사전학습</text><text x="94" y="66" text-anchor="middle" fill="#fff" opacity=".78" class="t b">다양한 말뭉치</text><text x="94" y="93" text-anchor="middle" fill="#fff" opacity=".78" class="t b">다음 토큰 예측</text><text x="94" y="120" text-anchor="middle" fill="#fff" opacity=".78" class="t b">트랜스포머</text><line x1="24" y1="142" x2="164" y2="142" stroke="#fff" opacity=".25"/><text x="94" y="164" text-anchor="middle" fill="#fff" class="t b">재사용 가능한 언어 표현</text><line class="line" x1="188" y1="90" x2="242" y2="90"/><g transform="translate(246)"><rect class="soft" width="170" height="48" rx="6"/><text class="t b" x="85" y="29" text-anchor="middle">개체·관계 추출</text><rect class="soft" y="66" width="170" height="48" rx="6"/><text class="t b" x="85" y="95" text-anchor="middle">자연어 → 질의</text><rect class="soft" y="132" width="170" height="48" rx="6"/><text class="t b" x="85" y="161" text-anchor="middle">결과 설명·요약</text></g></g>
  <rect x="472" y="333" width="416" height="45" rx="6" fill="#F2F5F9"/><text class="t b" x="680" y="360" text-anchor="middle">프롬프트 · 예시 · 제한적 조정으로 과제를 기술</text>
</svg>
