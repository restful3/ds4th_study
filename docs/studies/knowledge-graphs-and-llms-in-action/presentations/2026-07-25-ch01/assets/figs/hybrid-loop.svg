<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">LLM과 지식 그래프의 운영 가능한 하이브리드 루프</title><desc id="desc">문서와 데이터 수집, LLM 추출, 검증 게이트, 지식 그래프 통합, 그래프 검색, 근거 기반 응답, 피드백이 순환한다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:Inter,'Noto Sans KR',sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:14px;font-weight:800}.m{font-size:12px;fill:#6B6B72}.box{fill:#fff;stroke:#0F2C59;stroke-width:1.5}.soft{fill:#F2F5F9;stroke:#B7C2D1;stroke-width:1.5}.navy{fill:#0F2C59}.line{stroke:#6B6B72;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="920" height="440" rx="12" fill="#FAFAF9"/><text class="t h" x="34" y="44">데모가 아니라 운영 시스템이 되려면 검증 게이트가 있어야 한다</text><text class="t m" x="34" y="68">생성과 검색 사이에 스키마·출처·중복·충돌 검증을 두고, 사용자 피드백을 다시 지식 수명주기로 돌린다.</text>
  <path class="line" d="M168 158H286"/><path class="line" d="M406 158H524"/><path class="line" d="M644 158H762"/><path class="line" d="M822 218V306H704"/><path class="line" d="M584 330H466"/><path class="line" d="M346 330H228"/><path class="line" d="M108 306V238C108 212 120 206 140 206"/>
  <g transform="translate(48 110)"><rect class="soft" width="120" height="96" rx="8"/><text class="t sh" x="60" y="36" text-anchor="middle">1. 수집</text><text class="t m" x="60" y="62" text-anchor="middle">문서 · DB</text><text class="t m" x="60" y="80" text-anchor="middle">이벤트 · 대화</text></g>
  <g transform="translate(286 110)"><rect class="box" width="120" height="96" rx="8"/><text class="t sh" x="60" y="36" text-anchor="middle">2. LLM 추출</text><text class="t m" x="60" y="62" text-anchor="middle">개체 · 관계</text><text class="t m" x="60" y="80" text-anchor="middle">속성 후보</text></g>
  <g transform="translate(524 110)"><rect class="navy" width="120" height="96" rx="8"/><text x="60" y="36" text-anchor="middle" fill="#fff" class="t sh">3. 검증</text><text x="60" y="62" text-anchor="middle" fill="#fff" opacity=".76" class="t m">스키마 · 출처</text><text x="60" y="80" text-anchor="middle" fill="#fff" opacity=".76" class="t m">중복 · 충돌</text></g>
  <g transform="translate(762 110)"><rect class="box" width="120" height="108" rx="8"/><text class="t sh" x="60" y="34" text-anchor="middle">4. KG 통합</text><text class="t m" x="60" y="60" text-anchor="middle">식별자 연결</text><text class="t m" x="60" y="78" text-anchor="middle">시간·근거 기록</text><text class="t m" x="60" y="96" text-anchor="middle">지식 갱신</text></g>
  <g transform="translate(584 282)"><rect class="box" width="120" height="96" rx="8"/><text class="t sh" x="60" y="36" text-anchor="middle">5. 그래프 탐색</text><text class="t m" x="60" y="62" text-anchor="middle">질의 · 경로</text><text class="t m" x="60" y="80" text-anchor="middle">관련 사실</text></g>
  <g transform="translate(346 282)"><rect class="box" width="120" height="96" rx="8"/><text class="t sh" x="60" y="36" text-anchor="middle">6. LLM 응답</text><text class="t m" x="60" y="62" text-anchor="middle">요약 · 설명</text><text class="t m" x="60" y="80" text-anchor="middle">출처 제시</text></g>
  <g transform="translate(108 282)"><rect class="soft" width="120" height="96" rx="8"/><text class="t sh" x="60" y="36" text-anchor="middle">7. 피드백</text><text class="t m" x="60" y="62" text-anchor="middle">정정 · 승인</text><text class="t m" x="60" y="80" text-anchor="middle">새 질문</text></g>
  <text class="t m" x="460" y="418" text-anchor="middle">핵심 통제점: LLM 출력은 ‘후보’이며, 검증을 통과한 정보만 공유 지식이 된다.</text>
</svg>
