<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">LLM과 지식 그래프의 상호 보완 구조</title><desc id="desc">LLM은 지식 그래프 구축, 질의, 요약을 돕고 검증·갱신된 지식 그래프는 통제 아래 LLM 답변의 정확성, 최신성, 설명 가능성을 강화한다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:Inter,'Noto Sans KR',sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:15px;font-weight:800}.b{font-size:13px}.m{font-size:12px;fill:#6B6B72}.box{fill:#fff;stroke:#B7C2D1;stroke-width:1.5}.soft{fill:#F2F5F9;stroke:#0F2C59;stroke-width:1.5}.navy{fill:#0F2C59}.line{stroke:#6B6B72;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="920" height="500" rx="12" fill="#FAFAF9"/><text class="t h" x="34" y="44">한쪽이 다른 쪽을 대체하는 것이 아니라 책임을 교환한다</text><text class="t m" x="34" y="68">LLM은 언어와 유연성, KG는 사실·관계·검증 경로를 맡는다.</text>
  <g transform="translate(70 132)"><rect class="navy" width="238" height="190" rx="10"/><text x="119" y="45" text-anchor="middle" fill="#fff" class="t h">LLM</text><text x="119" y="75" text-anchor="middle" fill="#fff" opacity=".74" class="t b">자연어 이해·생성</text><line x1="34" y1="95" x2="204" y2="95" stroke="#fff" opacity=".25"/><text x="34" y="126" fill="#fff" class="t b">비정형 문서 해석</text><text x="34" y="154" fill="#fff" class="t b">질문 의도 파악</text><text x="34" y="182" fill="#fff" class="t b">결과 서술</text></g>
  <g transform="translate(612 132)"><rect class="soft" width="238" height="190" rx="10"/><text x="119" y="45" text-anchor="middle" class="t h">지식 그래프</text><text x="119" y="75" text-anchor="middle" class="t m">명시적 지식·관계</text><line x1="34" y1="95" x2="204" y2="95" stroke="#0F2C59" opacity=".2"/><text x="34" y="126" class="t b">검증된 사실·출처</text><text x="34" y="154" class="t b">지속 갱신되는 상태</text><text x="34" y="182" class="t b">탐색 가능한 경로</text></g>
  <path class="line" d="M308 172 C405 104 514 104 612 172"/><path class="line" d="M612 282 C515 350 405 350 308 282"/>
  <rect class="box" x="364" y="112" width="192" height="108" rx="8"/><text class="t sh" x="460" y="140" text-anchor="middle">LLM → KG</text><text class="t b" x="382" y="167">01 구축: 후보 추출</text><text class="t b" x="382" y="190">02 질의: 자연어 변환</text><text class="t b" x="382" y="213">03 요약: 결과 설명</text>
  <rect class="box" x="364" y="272" width="192" height="108" rx="8"/><text class="t sh" x="460" y="300" text-anchor="middle">KG → LLM</text><text class="t b" x="382" y="327">01 정확성: 오류 감소</text><text class="t b" x="382" y="350">02 최신성: 외부 상태</text><text class="t b" x="382" y="373">03 설명성: 경로 추적</text>
  <g transform="translate(70 412)"><rect class="soft" width="780" height="48" rx="6"/><text class="t sh" x="390" y="30" text-anchor="middle">결합의 산출물 = 자연어로 접근 가능한, 근거가 남는 지능형 시스템</text></g>
</svg>
