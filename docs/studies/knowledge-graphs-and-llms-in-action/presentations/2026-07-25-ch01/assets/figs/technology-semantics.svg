<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">RDF와 LPG 표현 위에 분류체계와 온톨로지를 얹는 의미 계층</title><desc id="desc">RDF와 LPG가 서로 다른 그래프 표현을 제공하고, 그 위에 분류체계와 온톨로지의 필요한 의미 규칙을 적용해 지식 그래프로 만든다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:Inter,'Noto Sans KR',sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:15px;font-weight:800}.b{font-size:13px}.m{font-size:12px;fill:#6B6B72}.box{fill:#fff;stroke:#B7C2D1;stroke-width:1.5}.soft{fill:#F2F5F9;stroke:#0F2C59;stroke-width:1.5}.navy{fill:#0F2C59}.line{stroke:#6B6B72;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="920" height="500" rx="12" fill="#FAFAF9"/><text class="t h" x="34" y="44">표현 모델을 고른 뒤, 문제 해결에 필요한 만큼 의미를 추가한다</text><text class="t m" x="34" y="68">RDF와 LPG는 지식을 담는 방식이고, taxonomy·ontology는 그 지식의 해석 규칙을 풍부하게 한다.</text>
  <g transform="translate(55 106)"><rect class="box" width="350" height="164" rx="9"/><text class="t sh" x="24" y="34">RDF · SPARQL</text><text class="t m" x="24" y="58">주어–술어–목적어 진술의 집합</text><g transform="translate(24 78)"><rect class="soft" width="84" height="38" rx="5"/><text class="t b" x="42" y="24" text-anchor="middle">약물 A</text><line class="line" x1="84" y1="19" x2="154" y2="19"/><rect class="soft" x="158" width="116" height="38" rx="5"/><text class="t b" x="216" y="24" text-anchor="middle">질병 B</text><text class="t m" x="119" y="10" text-anchor="middle">치료한다</text></g><text class="t m" x="24" y="144">강점: 표준 진술 · 연합 · 상호운용성 · 온톨로지 추론</text></g>
  <g transform="translate(515 106)"><rect class="box" width="350" height="164" rx="9"/><text class="t sh" x="24" y="34">LPG · openCypher / Gremlin</text><text class="t m" x="24" y="58">레이블 노드·고유 엣지·각 요소의 속성</text><g transform="translate(24 78)"><circle cx="42" cy="19" r="19" fill="#F2F5F9" stroke="#0F2C59"/><text class="t m" x="42" y="23" text-anchor="middle">A</text><line class="line" x1="61" y1="19" x2="213" y2="19"/><circle cx="238" cy="19" r="19" fill="#F2F5F9" stroke="#0F2C59"/><text class="t m" x="238" y="23" text-anchor="middle">B</text><rect x="91" y="-1" width="84" height="20" rx="10" fill="#FAFAF9"/><text class="t m" x="133" y="13" text-anchor="middle">치료한다</text><text class="t m" x="133" y="37" text-anchor="middle">since: 2024</text></g><text class="t m" x="24" y="144">강점: 관계 속성 · 경로 탐색 · 그래프 순회</text></g>
  <path class="line" d="M230 270V322H360"/><path class="line" d="M690 270V322H560"/>
  <g transform="translate(238 322)"><rect class="navy" width="444" height="58" rx="8"/><text x="222" y="35" text-anchor="middle" fill="#fff" class="t sh">지식 그래프 = 구조 + 조직 원리로서의 의미</text></g>
  <g transform="translate(108 410)"><rect class="soft" width="290" height="58" rx="8"/><text class="t sh" x="145" y="25" text-anchor="middle">분류체계</text><text class="t m" x="145" y="44" text-anchor="middle">탈것 ⊃ 자동차 ⊃ 세단</text></g>
  <g transform="translate(522 410)"><rect class="soft" width="290" height="58" rx="8"/><text class="t sh" x="145" y="25" text-anchor="middle">온톨로지 · just enough</text><text class="t m" x="145" y="44" text-anchor="middle">동일성 · 서로소 · 제약 · 추론</text></g>
  <line class="line" x1="398" y1="439" x2="514" y2="439"/>
</svg>
